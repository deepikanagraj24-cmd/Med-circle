{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Upload Reel - MedCircle</title>

    <link rel="stylesheet"
          href="{% static 'css/style.css' %}">

</head>

<body>

<nav class="navbar">

    <div class="nav-logo">
        🩺 MedCircle
    </div>

    <div class="nav-links">

        <a href="{% url 'dashboard' %}">
            Home
        </a>

        <a href="{% url 'doctors' %}">
            Doctors
        </a>

        <a href="{% url 'reels' %}">
            Reels
        </a>

        <a href="{% url 'messages' %}">
            Messages
        </a>

        <a href="{% url 'profile' %}">
            Profile
        </a>

        <a href="{% url 'logout' %}"
           class="logout">
            Logout
        </a>

    </div>

</nav>


<div class="upload-page">

    <div class="upload-card">

        <div class="upload-icon">
            🎬
        </div>

        <h1>Upload a Reel</h1>

        <p>
            Share medical knowledge with the MedCircle community.
        </p>

        <form method="POST"
              enctype="multipart/form-data">

            {% csrf_token %}

            <label>
                Select Video
            </label>

            <input
                type="file"
                name="video"
                accept="video/*"
                required
            >

            <label>
                Caption
            </label>

            <textarea
                name="caption"
                placeholder="Write something about your reel..."
                rows="4"></textarea>

            <button
                type="submit"
                class="primary-button">

                🚀 Upload Reel

            </button>

        </form>

    </div>

</div>

</body>

</html>
